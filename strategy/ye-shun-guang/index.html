<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代理人攻略 · 叶瞬光</title>
  <meta name="description" content="绝区零代理人攻略原型页：叶瞬光（凛刃 / 强攻）技能与影画数据" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    页面外壳。所有内容由 app.js 从 data/ye-shun-guang.json 动态渲染，
    因此同一套页面可直接用于任何代理人（只需更换抓取产出）。
    加载态与错误态在此静态声明，避免 JSON 就绪前出现白屏。
  -->
  <div id="app" class="app" data-state="loading">
    <div class="boot">
      <div class="boot__spinner" aria-hidden="true"></div>
      <p class="boot__text">正在加载攻略数据…</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
