[project]
name = "zzz-panel-and-strategy"
version = "0.1.0"
description = "绝区零代理人面板计算器：Vue3 前端 + Python 计算服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "matplotlib>=3.10.6",
    "pandas>=3.0.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
zzz-panel-and-strategy = "zzz_panel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/zzz_panel"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
