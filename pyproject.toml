[project]
name = "zzz-panel-and-strategy"
version = "0.1.0"
description = "绝区零代理人面板计算器：Vue3 前端 + Python 计算服务"
readme = "README.md"
requires-python = ">=3.13"
# 只保留 Worker 也需要的纯依赖。pywrangler 只解析本列表，任何带 C/Rust 扩展的
# 包（如 uvicorn[standard] 拉进来的 uvloop、httptools）都没有 PyEmscripten wheel，
# 会让 `pywrangler sync` 直接失败——本地开发用的 uvicorn 因此放在 dev 组。
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "uvicorn[standard]>=0.32",
]
# Cloudflare Python Worker 的工具链。仅部署时需要，故与 dev 分开：
# `uv run --group worker pywrangler dev|deploy`。uv sync 默认不装这一组。
worker = [
    "workers-py",
    "workers-runtime-sdk",
]

[project.scripts]
zzz-panel-and-strategy = "zzz_panel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/zzz_panel"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
